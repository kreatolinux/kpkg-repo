# gnome-session-ctl --restart-dbus stops dbus.service at the end of a GNOME
# session and relies on dbus.socket to start a fresh bus for the next one.
# Kreato's user bus has no socket unit (see dbus.service), so restart it
# instead: a later login of the same user (whose user manager may outlive
# this session) still finds a bus at $XDG_RUNTIME_DIR/bus.
[Service]
Type=oneshot
ExecStart=
ExecStart=-/usr/bin/systemctl --user --no-block restart dbus.service
