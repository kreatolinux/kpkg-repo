# Native aarch64 builder rootfs.
# Unlike amd64, aarch64 has no published binaries yet, so every package is
# built from source (this is the bootstrap path, issue #108).
[General]
BuildDirectory=/out
BuildPackages=yes

[Core]
Libc=glibc
Compiler=gcc
Coreutils=busybox
TlsLibrary=openssl
Init=jumpstart

[Extras]
ExtraPackages="gmake nim gtar"
