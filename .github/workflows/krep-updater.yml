name: Update upstream package recipes

on:
  schedule:
    - cron: '0 3 * * SUN'
  workflow_dispatch:

concurrency:
  group: krep-updater
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    container: ghcr.io/kreatolinux/builder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find latest successful krep build
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          response=$(mktemp)
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/kreatolinux/src/actions/workflows/build.yml/runs?per_page=20" \
                --output "$response"; then
              run_id=$(awk '/"id":/ { match($0, /[0-9]+/); id=substr($0, RSTART, RLENGTH) }
                             /"conclusion": "success"/ { print id; exit }' "$response")
              [ -n "$run_id" ] && break
            fi
            sleep 5
          done
          test -n "${run_id:-}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download krep artifact
        uses: actions/download-artifact@v8
        with:
          name: krep-amd64-linux-release
          path: /tmp/krep-artifact
          github-token: ${{ secrets.GH_PAT }}
          repository: kreatolinux/src
          run-id: ${{ steps.source-run.outputs.run_id }}

      - name: Update all eligible recipes once
        run: |
          set -euo pipefail
          KREP=$(find /tmp/krep-artifact -type f -name krep -print -quit)
          test -n "$KREP"
          chmod +x "$KREP"
          "$KREP" update --package='*' --repo="$GITHUB_WORKSPACE" \
            --backend=repology --skipIfDownloadFails --verbose

      - name: Validate updater diff
        id: changes
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git status --porcelain=v1 | cut -c4-)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=$(printf '%s\n' "${changed_files[@]}" | grep -Ev '^[^/]+/run3$' || true)
          if [ -n "$unexpected" ]; then
            echo "krep changed files other than package run3 recipes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
          KREP=$(find /tmp/krep-artifact -type f -name krep -print -quit)
          for recipe in "${changed_files[@]}"; do
            "$KREP" lint --path="$GITHUB_WORKSPACE/$recipe"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or refresh updater pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          branch: automation/krep-updates
          delete-branch: true
          commit-message: 'chore: update upstream package recipes'
          title: 'chore: update upstream package recipes'
          body: |
            Automated recipe updates generated by the latest successful krep release artifact.

            The workflow performs one serialized wildcard update pass, rejects non-run3 changes,
            and validates the resulting recipes before opening this pull request.
          labels: automated
