      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
