name: CI

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  schedule:
    - cron: '0 0 * * WED'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Validate an open PR without publishing, or build a merged PR in dependency order'
        required: false
        default: ''
      package:
        description: 'Space-separated list of packages to build'
        required: false
        default: ''
      arch:
        description: 'Architecture to build for'
        required: false
        default: 'both'
        type: choice
        options: [x86_64, arm64, both]
      image:
        description: 'Container image to use'
        required: false
        default: 'builder-repo'
        type: choice
        options: [builder-repo, builder-systemd, builder]
      image_sha:
        description: 'Optional SHA256 digest for the container image'
        required: false
        default: ''
      force_build:
        description: 'Force build even if a package archive exists'
        required: false
        default: false
        type: boolean
      llvm:
        description: 'Enable LLVM and set clang as compiler'
        required: false
        default: false
        type: boolean
      enable_upterm_ssh:
        description: 'Enable upterm SSH session if build fails'
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  init:
    runs-on: ubuntu-latest
    container: ghcr.io/kreatolinux/builder
    outputs:
      level1_matrix: ${{ steps.compute-matrix.outputs.level1_matrix }}
      level2_matrix: ${{ steps.compute-matrix.outputs.level2_matrix }}
      level3_matrix: ${{ steps.compute-matrix.outputs.level3_matrix }}
      level4_matrix: ${{ steps.compute-matrix.outputs.level4_matrix }}
      level5_matrix: ${{ steps.compute-matrix.outputs.level5_matrix }}
      level6_matrix: ${{ steps.compute-matrix.outputs.level6_matrix }}
      level7_matrix: ${{ steps.compute-matrix.outputs.level7_matrix }}
      level8_matrix: ${{ steps.compute-matrix.outputs.level8_matrix }}
      level9_matrix: ${{ steps.compute-matrix.outputs.level9_matrix }}
      level10_matrix: ${{ steps.compute-matrix.outputs.level10_matrix }}
      level11_matrix: ${{ steps.compute-matrix.outputs.level11_matrix }}
      level12_matrix: ${{ steps.compute-matrix.outputs.level12_matrix }}
      level13_matrix: ${{ steps.compute-matrix.outputs.level13_matrix }}
      level14_matrix: ${{ steps.compute-matrix.outputs.level14_matrix }}
      level15_matrix: ${{ steps.compute-matrix.outputs.level15_matrix }}
      level16_matrix: ${{ steps.compute-matrix.outputs.level16_matrix }}
      level17_matrix: ${{ steps.compute-matrix.outputs.level17_matrix }}
      level18_matrix: ${{ steps.compute-matrix.outputs.level18_matrix }}
      level19_matrix: ${{ steps.compute-matrix.outputs.level19_matrix }}
      level20_matrix: ${{ steps.compute-matrix.outputs.level20_matrix }}
      level21_matrix: ${{ steps.compute-matrix.outputs.level21_matrix }}
      level22_matrix: ${{ steps.compute-matrix.outputs.level22_matrix }}
      level23_matrix: ${{ steps.compute-matrix.outputs.level23_matrix }}
      level24_matrix: ${{ steps.compute-matrix.outputs.level24_matrix }}
      level25_matrix: ${{ steps.compute-matrix.outputs.level25_matrix }}
      level26_matrix: ${{ steps.compute-matrix.outputs.level26_matrix }}
      level27_matrix: ${{ steps.compute-matrix.outputs.level27_matrix }}
      level28_matrix: ${{ steps.compute-matrix.outputs.level28_matrix }}
      level29_matrix: ${{ steps.compute-matrix.outputs.level29_matrix }}
      level30_matrix: ${{ steps.compute-matrix.outputs.level30_matrix }}
      level31_matrix: ${{ steps.compute-matrix.outputs.level31_matrix }}
      level32_matrix: ${{ steps.compute-matrix.outputs.level32_matrix }}
      push: ${{ steps.compute-matrix.outputs.push }}
      pr_validation: ${{ steps.compute-matrix.outputs.pr_validation }}
      source_ref: ${{ steps.compute-matrix.outputs.source_ref }}
      should_build: ${{ steps.compute-matrix.outputs.should_build }}
      runfiles: ${{ steps.check-sums.outputs.runfiles }}
      image: ${{ steps.compute-matrix.outputs.image }}
      image_sha: ${{ steps.compute-matrix.outputs.image_sha }}
      force_build: ${{ steps.compute-matrix.outputs.force_build }}
      llvm: ${{ steps.compute-matrix.outputs.llvm }}
      enable_upterm_ssh: ${{ steps.compute-matrix.outputs.enable_upterm_ssh }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Find latest successful kpkg build
        id: get-run-id
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            LATEST_RUN_ID=$(curl -s --fail -H "Authorization: Bearer ${{ secrets.GH_PAT }}"               "https://api.github.com/repos/kreatolinux/src/actions/workflows/build.yml/runs?per_page=20"               | awk '/"id":/ { match($0, /[0-9]+/); lastid=substr($0, RSTART, RLENGTH) }
                     /"conclusion": "success"/ { print lastid; exit }') && [ -n "$LATEST_RUN_ID" ] && break
            sleep 5
          done
          test -n "${LATEST_RUN_ID:-}"
          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: kpkg-amd64-linux-debug
          path: /tmp/kpkg-bin
          github-token: ${{ secrets.GH_PAT }}
          repository: kreatolinux/src
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: Compute dependency levels and flags
        id: compute-matrix
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          ARCH="${{ github.event.inputs.arch || 'both' }}"
          PUSH=true
          PR_VALIDATION=false
          SOURCE_REF=""
          SHOULD_BUILD=true
          PACKAGES=""

          echo "image=${{ github.event.inputs.image || 'builder-repo' }}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${{ github.event.inputs.image_sha || '' }}" >> "$GITHUB_OUTPUT"
          echo "force_build=${{ github.event.inputs.force_build || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "llvm=${{ github.event.inputs.llvm || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "enable_upterm_ssh=${{ github.event.inputs.enable_upterm_ssh || 'false' }}" >> "$GITHUB_OUTPUT"

          all_packages() {
            for path in "$GITHUB_WORKSPACE"/*; do
              [ -d "$path" ] || continue
              if [ -f "$path/run3" ] || [ -f "$path/run" ]; then basename "$path"; fi
            done | sort -u
          }

          if [ -n "${PR_NUMBER:-}" ]; then
            case "$PR_NUMBER" in (*[!0-9]*|'') echo "invalid PR number: $PR_NUMBER" >&2; exit 1;; esac
            PR_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            SHAS=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; p=json.load(sys.stdin); print(p["base"]["sha"], p["head"]["sha"])')
            BASE_SHA=${SHAS%% *}
            HEAD_SHA=${SHAS##* }
            PR_STATE=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            if [ "$PR_STATE" = open ]; then
              PUSH=false
              PR_VALIDATION=true
              SOURCE_REF=$HEAD_SHA
            elif [ "$PR_STATE" = closed ]; then
              MERGED=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["merged"]).lower())')
              if [ "$MERGED" != true ]; then
                echo "PR $PR_NUMBER was closed without merging" >&2
                exit 1
              fi
              # A merged updater PR can use the real dependency graph and
              # publish its packages in dependency order. Never flatten it.
              echo "Building merged PR $PR_NUMBER using ordered topology."
            else
              echo "unexpected PR state: $PR_STATE" >&2
              exit 1
            fi
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            PACKAGES=$(printf '%s\n' "$CHANGED_FILES" | awk -F/ 'NF > 1 {print $1}' | sort -u | while read -r package; do
              if git cat-file -e "$HEAD_SHA:$package/run3" 2>/dev/null || git cat-file -e "$HEAD_SHA:$package/run" 2>/dev/null; then printf '%s\n' "$package"; fi
            done)
            if [ -z "$PACKAGES" ]; then SHOULD_BUILD=false; fi
          elif [ -n "${PACKAGE_INPUT:-}" ]; then
            PACKAGES=$(printf '%s\n' $PACKAGE_INPUT | sort -u)
            if [ "$ARCH" = x86_64 ]; then PUSH=false; fi
          elif [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            PACKAGES=$(all_packages)
          else
            if [ "${{ github.event_name }}" = pull_request ]; then
              PUSH=false
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
              CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
            else
              BEFORE_SHA="${{ github.event.before }}"
              if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" || true)
              else
                CHANGED_FILES=$(git show --name-only --pretty=format: "${{ github.sha }}" | tail -n +2 || true)
              fi
            fi
            CHANGED_RUNFILES=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^[^/]+/run3?$' || true)
            RUN_PKG_COUNT=$(printf '%s\n' "$CHANGED_RUNFILES" | awk -F/ 'NF {print $1}' | sort -u | wc -l | tr -d ' ')
            TOTAL_CHANGED_COUNT=$(printf '%s\n' "$CHANGED_FILES" | awk 'NF' | wc -l | tr -d ' ')
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^\.github/(workflows/|scripts/ci-topology\.py|scripts/test_ci_topology\.py)'; then
              # Scheduler changes must exercise the complete generated graph.
              PACKAGES=$(all_packages)
            elif [ "$RUN_PKG_COUNT" = 1 ] && { [ "${{ github.event_name }}" = pull_request ] || [ "$TOTAL_CHANGED_COUNT" = 1 ]; }; then
              PACKAGES=$(printf '%s\n' "$CHANGED_RUNFILES" | head -n1 | cut -d/ -f1)
            else
              SHOULD_BUILD=false
            fi
          fi

          KPKG_BIN=$(find /tmp/kpkg-bin -type f -name kpkg -print -quit)
          test -n "$KPKG_BIN"
          chmod +x "$KPKG_BIN"
          rm -rf /etc/kpkg/repos/main
          mkdir -p /etc/kpkg/repos
          ln -s "$GITHUB_WORKSPACE" /etc/kpkg/repos/main

          if [ "$SHOULD_BUILD" = true ] && [ -n "$PACKAGES" ]; then
            ROOTS=$(printf '%s\n' "$PACKAGES" | paste -sd, -)
            if [ "${{ github.event_name }}" = pull_request ] || [ "$PR_VALIDATION" = true ]; then
              # PR jobs cannot publish dependency artifacts for later levels.
              # Keep selected roots in one level; kpkg resolves their closure locally.
              python3 -c 'import json,sys; roots=sorted(set(sys.argv[1].split(","))); print(json.dumps({"schema_version":1,"roots":roots,"nodes":[{"name":name,"repo":"main"} for name in roots],"edges":[]},separators=(",",":")))' "$ROOTS" > /tmp/topology.json
            else
              KPKG_ENABLE_DEBUG=0 "$KPKG_BIN" repl -a "get --all depends.$ROOTS.build.json" > /tmp/topology.json
            fi
          else
            printf '%s\n' '{"schema_version":1,"roots":[],"nodes":[],"edges":[]}' > /tmp/topology.json
          fi
          python3 .github/scripts/ci-topology.py /tmp/topology.json             --arch "$ARCH" --max-levels 32 --github-output "$GITHUB_OUTPUT"             --plan-json /tmp/ci-topology-plan.json
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "pr_validation=$PR_VALIDATION" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Check if sums need updating
        id: check-sums
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "runfiles=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
          CHANGED_RUNFILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*/run' || true)
          RUNFILES_NEED=""
          for f in $CHANGED_RUNFILES; do
            if git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -E '^\+VERSION=' >/dev/null &&
               ! git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -E '^(\+SHA256SUM=|\+SHA512SUM=|\+B2SUM=)' >/dev/null; then
              RUNFILES_NEED="${RUNFILES_NEED}"$'\n'"$f"
            fi
          done
          echo "runfiles<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RUNFILES_NEED" | awk 'NF' >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"

  update-sums:
    if: needs.init.outputs.runfiles != ''
    needs: [init]
    uses: ./.github/workflows/update-sums.yml
    with:
      runfiles: ${{ needs.init.outputs.runfiles }}

  build_level1:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level1_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level1_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 1"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level2:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level2_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level1]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level2_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 2"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level3:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level3_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level2]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level3_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 3"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level4:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level4_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level3]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level4_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 4"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level5:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level5_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level4]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level5_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 5"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level6:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level6_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level5]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level6_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
      phase_name: "Dependency level 6"
      image: ${{ needs.init.outputs.image }}
      image_sha: ${{ needs.init.outputs.image_sha }}
      force_build: ${{ needs.init.outputs.pr_validation == 'true' || github.event_name == 'pull_request' || needs.init.outputs.force_build == 'true' }}
      llvm: ${{ needs.init.outputs.llvm == 'true' }}
      enable_upterm_ssh: ${{ needs.init.outputs.enable_upterm_ssh == 'true' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_USERNAME: ${{ secrets.OTEL_USERNAME }}
      OTEL_PASSWORD: ${{ secrets.OTEL_PASSWORD }}
      LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}

  build_level7:
    if: >-
      always() && !cancelled() &&
      needs.init.outputs.level7_matrix != '' &&
      (needs.init.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.update-sums.result == 'success' || needs.update-sums.result == 'skipped')
    needs: [init, update-sums, build_level6]
    uses: ./.github/workflows/ci-build.yml
    with:
      matrix: ${{ needs.init.outputs.level7_matrix }}
      push: ${{ needs.init.outputs.push }}
      pr_validation: ${{ needs.init.outputs.pr_validation == 'true' }}
      source_ref: ${{ needs.init.outputs.source_ref }}
