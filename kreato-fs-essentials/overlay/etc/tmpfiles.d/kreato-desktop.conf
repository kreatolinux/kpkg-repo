# Directories the desktop stack expects. /var is writable on the live overlay,
# but none of these are shipped by any Kreato package.
# L+ replaces a /var/run directory left behind by older packages.
L+ /var/run - - - - /run
L /usr/var/run - - - - /run
d /var/log 0755 root root -
f /var/log/wtmp 0664 root utmp -
f /var/log/btmp 0660 root utmp -
f /var/log/lastlog 0664 root utmp -
d /var/lib/dbus 0755 root root -
L /var/lib/dbus/machine-id - - - - /etc/machine-id
d /run/dbus 0755 root root -
d /run/udev 0755 root root -
d /run/user 0755 root root -
d /tmp/.X11-unix 1777 root root -
d /var/lib/AccountsService 0775 root root -
d /var/lib/AccountsService/users 0700 root root -
d /var/lib/AccountsService/icons 0775 root root -
d /var/lib/upower 0755 root root -
d /var/lib/polkit-1 0700 polkitd root -
d /var/lib/colord 0755 colord colord -
d /var/lib/colord/icc 0755 colord colord -
d /var/lib/xkb 0755 root root -
d /var/cache/fontconfig 0755 root root -
d /var/lib/gdm 0755 120 120 -
d /var/lib/gdm/.config 0700 120 120 -
d /var/lib/gdm/.cache 0700 120 120 -
d /var/lib/gdm/.local/state 0700 120 120 -
d /var/log/gdm 0711 gdm gdm -
d /run/gdm 0711 root gdm -
d /var/empty 0755 root root -
d /run/sshd 0755 root root -
